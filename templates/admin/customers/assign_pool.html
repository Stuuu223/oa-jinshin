{% extends "admin/base_site.html" %}
{% block content %}
<style>
  .assign-pool-card { max-width: 560px; margin: 0 auto; padding: 24px; border: 1px solid #E5E7EB; border-radius: 12px; background: #fff; }
  .assign-pool-card h2 { margin: 0 0 8px 0; font-size: 16px; }
  .assign-pool-card .lead { color: #6B7280; font-size: 13px; margin-bottom: 20px; }
  .assign-row { margin-bottom: 16px; }
  .assign-row label { display: block; font-weight: 500; margin-bottom: 4px; font-size: 13px; }
  .assign-row select, .assign-row input[type=text] { width: 100%; padding: 8px 10px; border: 1px solid #D1D5DB; border-radius: 6px; font-size: 13px; }
  .q-list { margin-top: 12px; margin-bottom: 20px; max-height: 160px; overflow-y: auto; border: 1px solid #E5E7EB; border-radius: 6px; padding: 8px 12px; background: #F9FAFB; font-size: 12px; color: #6B7280; }
  .assign-actions { text-align: right; }
  .assign-actions button { padding: 8px 20px; background: #1D4ED8; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; margin-right: 8px; }
  .assign-actions a { color: #6B7280; text-decoration: none; }
</style>
<form method="post">
  {% csrf_token %}
  {% for obj in queryset %}
    <input type="hidden" name="{{ action_checkbox_name }}" value="{{ obj.pk }}">
  {% endfor %}
  <input type="hidden" name="action" value="assign_pool">
  <input type="hidden" name="apply" value="1">

  <div class="assign-pool-card">
    <h2>调配公海客户</h2>
    <p class="lead">将 {{ queryset|length }} 个公海客户分配给指定销售</p>
    <div class="q-list">
      {% for obj in queryset %}
        <span>{{ obj.company }}</span>{% if not forloop.last %}、{% endif %}
      {% endfor %}
    </div>
    <div class="assign-row">
      <label for="new_owner">目标销售</label>
      <select name="new_owner" id="new_owner" required>
        {% for u in sales_users %}<option value="{{ u.pk }}">{{ u.real_name }}</option>{% endfor %}
      </select>
    </div>
    <div class="assign-row">
      <label for="reason">调配理由</label>
      <input type="text" name="reason" id="reason" placeholder="如: 小王擅长该行业 / 原销售离职" required>
    </div>
    <div class="assign-actions">
      <button type="submit">确认调配</button>
      <a href=".">取消</a>
    </div>
  </div>
</form>
{% endblock %}
